<svg xmlns="http://www.w3.org/2000/svg" width="680" height="660" viewBox="0 0 680 660">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <style>
      .ui { font-family: "JetBrainsMono Nerd Font", "JetBrains Mono", monospace; }
      .title { font-size: 21px; font-weight: 700; fill: #ead8bd; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; fill: #a9977f; }
      .body { font-size: 15px; font-weight: 700; fill: #ead8bd; }
      .small { font-size: 13px; fill: #a9977f; }
      .caption { font-size: 12px; fill: #a9977f; }
    </style>
  </defs>

  <rect width="680" height="660" fill="#101c24"/>
  <rect x="40" y="24" width="600" height="612" rx="1" fill="#302d27" stroke="#b99a65" stroke-width="2" filter="url(#shadow)"/>

  <!-- Bluetooth-style title region -->
  <text class="ui" x="67" y="86" font-size="34" fill="#ead8bd">☤</text>
  <text class="ui title" x="116" y="70">Hermes Watcher</text>
  <text class="ui section" x="116" y="91">1 BOT WORKING</text>
  <rect x="571" y="58" width="40" height="22" rx="11" fill="#7d6c4b"/>
  <circle cx="600" cy="69" r="8" fill="#e9c36e"/>

  <line x1="61" y1="117" x2="619" y2="117" stroke="#504b41" stroke-width="1"/>

  <text class="ui section" x="62" y="149">BOTS</text>

  <!-- Working bot card with proposed context gauge -->
  <rect x="61" y="166" width="558" height="133" rx="3" fill="#37342e"/>
  <text class="ui" x="78" y="196" font-size="16" fill="#e9c36e">◷</text>
  <text class="ui body" x="108" y="196">omarchy-bot · Working</text>
  <text class="ui small" x="108" y="220">1 active turn · gpt-5.6-sol · cli</text>

  <text class="ui caption" x="108" y="249">CONTEXT</text>
  <text class="ui caption" x="582" y="249" text-anchor="end" fill="#e9c36e">68%</text>
  <rect x="108" y="260" width="474" height="8" rx="4" fill="#575145"/>
  <rect x="108" y="260" width="322" height="8" rx="4" fill="#e0b94f"/>
  <text class="ui caption" x="108" y="286">186k / 272k · 1 compression</text>

  <!-- Online bot retains compact card -->
  <rect x="61" y="309" width="558" height="66" rx="3" fill="#37342e"/>
  <text class="ui" x="78" y="338" font-size="16" fill="#a9977f">◎</text>
  <text class="ui body" x="108" y="338">default · Online</text>
  <text class="ui small" x="108" y="360">1 open session · open for 3h 54m</text>

  <line x1="61" y1="397" x2="619" y2="397" stroke="#504b41" stroke-width="1"/>
  <text class="ui section" x="62" y="430">RECENT</text>

  <rect x="61" y="447" width="56" height="38" rx="2" fill="#655b47"/>
  <text class="ui" x="89" y="471" font-size="13" font-weight="700" fill="#f0cf78" text-anchor="middle">All</text>
  <rect x="127" y="447" width="95" height="38" rx="2" fill="none" stroke="#575145"/>
  <text class="ui small" x="174" y="471" text-anchor="middle" fill="#d8c8ae">Success</text>
  <rect x="232" y="447" width="82" height="38" rx="2" fill="none" stroke="#575145"/>
  <text class="ui small" x="273" y="471" text-anchor="middle" fill="#d8c8ae">Issues</text>

  <rect x="61" y="501" width="558" height="66" rx="3" fill="#37342e"/>
  <text class="ui" x="78" y="532" font-size="17" fill="#ead8bd">✓</text>
  <text class="ui body" x="108" y="531">omarchy-bot · Succeeded</text>
  <text class="ui small" x="108" y="553">gpt-5.6-sol · cli · 17m · 8m ago</text>

  <rect x="61" y="576" width="558" height="42" rx="3" fill="#37342e"/>
  <text class="ui caption" x="78" y="601">Context gauge shown only when Hermes reports reliable usage.</text>
</svg>
